# fly.toml app configuration file generated for cortex-judging-demo on 2026-05-03T13:55:05+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cortex-judging-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  AXL_BIN = '/app/infra/axl/bin/node-linux'
  AXL_MCP_BASE_PORT = '9303'
  ENS_GATEWAY_URL = 'http://127.0.0.1:8787'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
